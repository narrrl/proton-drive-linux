<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proton Drive for Linux">
  <defs>
    <linearGradient id="pdl-bg" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B72FF"/>
      <stop offset="1" stop-color="#5A38E8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#pdl-bg)"/>

  <!-- cloud: the remote drive -->
  <g fill="#FFFFFF">
    <circle cx="51" cy="50" r="17"/>
    <circle cx="74" cy="46" r="21"/>
    <circle cx="90" cy="59" r="14"/>
    <rect x="40" y="55" width="52" height="18" rx="9"/>
  </g>

  <!-- pull: files arrive only when opened -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 82v18"/>
    <path d="M54 92l10 10 10-10"/>
    <path d="M46 112h36" stroke-opacity="0.55"/>
  </g>
</svg>
